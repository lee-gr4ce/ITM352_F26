<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
</head>
<body>
    <h1>Quiz complete</h1>
    <p>You got {{ result.score }} out of {{ result.total }} correct.</p>
    <p>Your best score is {{ result.best_score }}.</p>
    {% if result.is_new_high_score %}
        <p>New high score!</p>
    {% endif %}
    <a href="{{ url_for('index') }}">Play again</a>
</body>
</html>
