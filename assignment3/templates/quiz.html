<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
</head>
<body>
    <h1>Question {{ question_number }} of {{ total_questions }}</h1>
    {% if timed %}
    <p>Time remaining: <span id="countdown">{{ timer_seconds }}</span> seconds</p>
    {% endif %}
    <form id="answer-form" method="POST" action="{{ url_for('answer') }}">
        <fieldset>
            <legend>{{ question }}</legend>
            {% for option in options %}
            <label>
                <input type="radio" name="answer" value="{{ option }}">
                {{ option }}
            </label><br>
            {% endfor %}
        </fieldset>
        <button type="submit">Submit Answer</button>
    </form>
    {% if timed %}
    <script>
        const countdown = document.getElementById("countdown");
        const answerForm = document.getElementById("answer-form");
        let remaining = parseInt("{{ timer_seconds }}", 10) || 0;
        if (remaining <= 0) {
            answerForm.requestSubmit();
        } else {
            const timer = window.setInterval(() => {
                remaining -= 1;
                countdown.textContent = Math.max(remaining, 0);
                if (remaining <= 0) {
                    window.clearInterval(timer);
                    answerForm.requestSubmit();
                }
            }, 1000);
        }
    </script>
    {% endif %}
</body>
</html>
