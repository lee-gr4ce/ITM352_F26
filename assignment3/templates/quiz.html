<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title> Welcome to the Quiz</title>
</head>
<body>
    <title> Quiz </title>
    <form method = "POST"> # sends a POST request to the server when the form is submitted; and only when submit button is clicked
        <h1> Question {{question_number}}: {{question_text}}</h1>
        {% for option in options %} # option buttons
            <input type="radio" name="answer" value="{{option}}"> {{option}}<br>
        {% endfor %}
        <button type="submit">Submit Answer</button>
    </form>
</body>
</html>
